<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김유진 — UI/UX Designer Portfolio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Gothic+A1:wght@300;400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=chillax@500&display=swap">   <!-- 네모박스 DRAG 글자 (Figma: Chillax Medium) -->
  <!-- 페이지 전환 — 노트북 클릭 때 work.html 이 아래에서 올라옴(연출은 work.html head). 양쪽 다 켜야 걸림.
       이 페이지로 돌아올 때(뒤로 가기)는 연출 없이 바로 -->
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  </style>
</head>
<body>

<!-- 화면 1: Figma #1 프레임. 1920 기준 무대를 화면에 맞춰 scale (src/stages/stage1.js). 본문은 data.js 의 DUMMY -->
<section class="layer" id="s1" aria-label="김유진">
  <div id="s1stage">
    <!-- 격자 — 선마다 따로 움직이도록 inline. 세로 좌표·높이는 box.js 가 무대 높이에 맞춰 다시 씀 (원본: public/s1/grid.svg) -->
    <svg id="s1grid" width="1800" height="960" viewBox="0 0 1800 960" aria-hidden="true">
      <rect class="bd" x=".5" y=".5" width="1799" height="959"/>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>   <!-- 겹선 5개: 284 · 586 · 888 · 1190 · 1492 -->
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <rect class="h" x="1" width="1798" height="1"/>   <!-- 가로선 3개: 237 · 480 · 724 -->
      <rect class="h" x="1" width="1798" height="1"/>
      <rect class="h" x="1" width="1798" height="1"/>
      <!-- 4번째 휠에 왼쪽에서 오른쪽으로 그려지는 새 가로선 8개(4쌍): 158·200 / 359·401 / 560·602 / 761·803 (box.js HY2) -->
      <rect class="h2" x="1" width="0" height="1"/><rect class="h2" x="1" width="0" height="1"/>
      <rect class="h2" x="1" width="0" height="1"/><rect class="h2" x="1" width="0" height="1"/>
      <rect class="h2" x="1" width="0" height="1"/><rect class="h2" x="1" width="0" height="1"/>
      <rect class="h2" x="1" width="0" height="1"/><rect class="h2" x="1" width="0" height="1"/>
    </svg>
    <!-- ABOUT ME — 5번째 휠에 왼쪽 아래에서 회전하며 들어옴 (about.js, Figma 167:2388). 크기·자리는 about.js 가 격자 높이에 맞춰.
         ABOUT 은 같은 그림 5장을 글자별로 잘라 쓴다 — 회전은 통째로 같지만, 클릭하면 글자 하나씩 지워져야 해서 (about.js BAND) -->
    <div id="s1about" aria-label="ABOUT">
      <img src="/s1/about.svg" alt="A" width="159" height="960" role="button" tabindex="0" aria-label="A — 이름 보기">
      <img src="/s1/about.svg" alt="B" width="159" height="960" role="button" tabindex="0" aria-label="B — EDUCATION 보기">
      <img src="/s1/about.svg" alt="O" width="159" height="960" role="button" tabindex="0" aria-label="O — ACTIVITIES 보기">
      <img src="/s1/about.svg" alt="U" width="159" height="960" role="button" tabindex="0" aria-label="U — SKILLS 보기">
      <img src="/s1/about.svg" alt="T" width="159" height="960" role="button" tabindex="0" aria-label="T — 사진 보기">
    </div>
    <img id="s1me" src="/s1/me.svg" alt="ME" width="350" height="158">
    <!-- 슬로건 — 맨 마지막 휠. M 은 ME 의 M 이 달려와 펴진 것(stage1.js renderWork), 여기엔 나머지 글자만 타이핑됨 (slogan.js) -->
    <p id="s1slogan" aria-label="Meaning in every Margin."><span aria-hidden="true"></span><i aria-hidden="true"></i></p>
    <span id="s1scratch" aria-hidden="true">SCRATCH<svg viewBox="0 0 21.0607 21.0607" width="21.0607" height="21.0607"><path d="M1.06066 20L19.5607 1.5M1.06066 1.5H21.0607M19.5607 0V20"/></svg></span>   <!-- 긁기 안내 — ABOUT 오른쪽 위, 화살표는 DRAG ↗ 를 뒤집은 ↙ (about.js scratchHint) -->
    <div id="s1cv"></div>   <!-- 클릭하면 글자 자리에 들어오는 이력 (about.js buildCv, 내용은 data.js CV) -->
    <div id="s1box" aria-hidden="true">
      <span id="s1drag">DRAG<svg viewBox="0 0 21.0607 21.0607" width="21.0607" height="21.0607"><path d="M1.06066 20L19.5607 1.5M1.06066 1.5H21.0607M19.5607 0V20"/></svg></span>   <!-- Figma 144:891 — 잡으면 사라지고 제자리로 돌아오면 다시 (box.js) -->
    </div>   <!-- 네모박스 — 퇴장 뒤 휠에 나타나고, 드래그로 커졌다 놓으면 돌아감 (box.js). 안에 프로젝트 사진 랜덤 (data.js BOX_SHOTS) -->
    <div id="s1bodyclip"><p id="s1body"></p></div>
    <div id="s1yearclip"><img id="s1year" src="/s1/year.svg" alt="2026 PORTFOLIO" width="286" height="25"></div>   <!-- 창 안에서 위로 올라가며 격자 윗선에 잘려 사라짐 -->
    <!-- 노트북 — 클릭하면 work.html. 사진은 Figma 에서 좌우 반전·크롭된 상태 그대로, 화면 안 CLICK 은 글자별 SVG 가 깜빡임 -->
    <a id="s1laptop" href="/work.html" aria-label="작업 보기">
      <span class="shot"><img src="/s1/laptop.png" alt="" width="1374" height="1145"></span>
      <span class="click" aria-hidden="true">
        <img class="c1" src="/s1/click-c1.svg" alt="" width="16" height="19">
        <img class="l"  src="/s1/click-l.svg"  alt="" width="13" height="20">
        <img class="i"  src="/s1/click-i.svg"  alt="" width="5"  height="20">
        <img class="c2" src="/s1/click-c2.svg" alt="" width="19" height="21">
        <img class="k"  src="/s1/click-k.svg"  alt="" width="19" height="24">
      </span>
      <span class="screen" aria-hidden="true"></span>   <!-- 노트북 화면(검은 부분)만 덮는 빈 칸 — 커서가 여기서만 초록이 된다 (cursor.js DARK). 클릭은 그대로 a 로 올라감 -->
    </a>
    <div id="s1name">   <!-- KIM YUJIN — 글자 영역 창. 시퀀스에서 이 창 아래로 사라짐 -->
      <img class="s1-k"  src="/s1/k.svg"  alt="K" width="249.138" height="370.86">
      <img class="s1-i"  src="/s1/i.svg"  alt="I" width="56.441"  height="370.817">
      <img class="s1-m"  src="/s1/m.svg"  alt="M" width="482.636" height="378">
      <img class="s1-y"  src="/s1/y.svg"  alt="Y" width="195"     height="234">
      <img class="s1-u"  src="/s1/u.svg"  alt="U" width="187"     height="234">
      <img class="s1-j"  src="/s1/j.svg"  alt="J" width="84.118"  height="233.997">
      <img class="s1-i2" src="/s1/i2.svg" alt="I" width="34"      height="233">
      <img class="s1-n"  src="/s1/n.svg"  alt="N" width="193.889" height="234.404">
    </div>
    <!-- WORK — 퇴장 때 M 이 바닥선으로 눌려 초록 선이 되고, 그 선이 격자선을 따라 달려 왼쪽 위 첫 가로선에서 W 로 펴진 뒤 O·R·K 가 펜으로 쓰듯 그려짐 (stage1.js renderWork).
         마지막 휠엔 거꾸로 선이 되어 ME 의 M 자리로 가 M 으로 펴짐. .w = 글자(M 그림, W 일 땐 위아래 뒤집음) · .run = 접힌 동안 격자선을 따라 달리는 선.
         M 은 #s1name 창에 갇혀 있어 위로 옮기면 잘리므로, 퇴장이 시작되면 진짜 M 은 숨기고 같은 그림이 그 자리에서 이어받는다. O·R·K 는 Figma 시안(202:29)의 필기체 벡터, .weave 는 o 앞을 지나는 W 기둥 조각.
         O·R·K 의 mask 안 path = 펜이 지나가는 가운데 선(획 순서대로, 굵기는 글자 획을 다 덮을 만큼) — 이 선을 앞에서부터 늘려 가며 글자를 드러낸다 -->
    <div id="s1work" aria-label="WORK"><img class="w" src="/s1/m.svg" alt="W" width="482.636" height="378"><svg class="run" aria-hidden="true"><path/></svg><svg
      class="ork" viewBox="0 0 91 52" preserveAspectRatio="none" role="img" aria-label="O"><mask id="s1orkO"><path stroke-width="7" d="M33.2 10.9C32.2 11.3 29.2 12.6 27 13.6C24.8 14.6 22.5 15.4 20 17C17.5 18.6 14.3 20.7 12 23C9.7 25.3 7.5 28.3 6 31C4.5 33.8 3 37 2.7 39.5C2.4 42 2.8 44.3 4 46C5.2 47.8 7.6 49.1 10 50C12.4 50.9 15.5 51.4 18.5 51.1C21.5 50.9 24.9 49.9 28 48.5C31.1 47.1 34.2 44.9 37 42.5C39.8 40.1 42.5 36.3 44.8 34C47 31.7 48.6 30.7 50.5 28.5C52.4 26.3 54.5 23.6 56 21C57.5 18.4 59.1 15.3 59.8 13C60.5 10.8 60.8 9.2 60.2 7.5C59.7 5.8 58.3 4 56.5 3C54.7 2 51.6 1.4 49.2 1.4C46.8 1.4 44 2.1 42 3C40 3.9 38.7 5.2 37.5 7C36.3 8.8 35.3 11.5 35 14C34.7 16.5 34.8 19.6 35.5 22C36.2 24.4 37.4 26.6 39 28.5C40.6 30.4 43 32.4 45 33.6C47 34.8 48.8 35.4 51 35.9C53.2 36.4 55.1 36.7 58.3 36.5C61.5 36.3 66.4 35.3 70 34.5C73.6 33.7 76.6 32.5 80 31.5C83.4 30.5 88.8 29.1 90.5 28.6"/></mask><image href="/s1/work-o.svg" width="91" height="52" mask="url(#s1orkO)"/></svg><svg
      class="ork" viewBox="0 0 108 49" preserveAspectRatio="none" role="img" aria-label="R"><mask id="s1orkR"><path stroke-width="8" d="M6.9 24.4C7 23.8 6.5 22.4 7.2 21C7.9 19.6 8.9 17.8 11 16C13.1 14.2 16.8 11.9 20 10C23.3 8.1 27.9 5.7 30.5 4.5C33.1 3.3 34.3 2.9 35.5 2.6C36.7 2.3 37.7 2.4 37.8 2.8C37.9 3.2 37.1 3.4 36.3 5C35.5 6.6 34.5 9.8 33 12.5C31.5 15.2 30.1 17.6 27.2 21C24.3 24.4 18.9 29.5 15.5 33C12.1 36.5 9.3 39.5 7 42C4.7 44.5 2.7 46.8 1.8 47.8"/><path stroke-width="7" d="M31.5 17C32.5 16.3 35.4 14.3 37.5 13C39.6 11.8 40.6 11.3 44 9.5C47.4 7.7 53.7 3.4 58 2C62.3 0.6 67 0.6 70 0.9C73 1.3 75.3 2.7 76.3 4C77.3 5.3 77 6.8 76 8.5C75 10.2 72.7 12.2 70 14C67.3 15.8 63.3 17.9 60 19.3C56.7 20.8 53.3 21.8 50 22.7C46.7 23.6 43.3 24.4 40 24.9C36.7 25.4 31.8 25.6 30 25.8C28.3 26.1 28.9 26.2 29.5 26.4C30.1 26.6 33.2 25.9 33.8 27C34.4 28.1 33.3 30.9 33.3 33C33.3 35.1 33.1 37.7 34 39.5C34.9 41.3 36.3 43.1 38.5 44C40.7 44.9 43.4 45 47 45C50.6 45 54.5 44.9 60 44C65.5 43.1 72.1 41.5 80 39.5C87.9 37.5 102.8 33.3 107.4 32.1"/></mask><image href="/s1/work-r.svg" width="108" height="49" mask="url(#s1orkR)"/></svg><svg
      class="ork" viewBox="0 0 108 47" preserveAspectRatio="none" role="img" aria-label="K"><mask id="s1orkK"><path stroke-width="8" d="M6.9 22.6C7 22.1 6.5 20.8 7.2 19.4C7.9 18 8.9 16.2 11 14.4C13.1 12.6 16.8 10.3 20 8.4C23.3 6.5 27.9 4.1 30.5 2.9C33.1 1.7 34.3 1.3 35.5 1C36.7 0.7 37.7 0.9 37.8 1.2C37.9 1.5 37.3 1.4 36.3 3C35.3 4.5 33.7 7.8 32 10.5C30.3 13.2 28 16.3 26 19C24 21.8 22.3 24.1 20 27C17.7 29.9 15 33.4 12 36.5C9 39.6 3.5 44.3 1.8 45.9"/><path stroke-width="7" d="M82 1.1C81.3 1.2 80 0.7 78 1.6C76 2.5 73.3 4.5 70 6.5C66.7 8.5 62.2 11.3 58 13.5C53.8 15.7 49.3 17.9 45 19.5C40.7 21.1 35 22.2 32 22.8C29 23.4 26.8 22.9 27 23.4C27.2 23.9 31.5 24.7 33 26C34.5 27.3 35.3 29 36 31C36.7 33 36.3 36 37 38C37.8 40 39 42.1 40.5 43.2C42 44.3 42.8 44.5 46 44.5C49.3 44.5 54.3 44.1 60 43C65.7 41.9 72.1 40.1 80 38C87.9 35.9 102.8 31.6 107.4 30.3"/></mask><image href="/s1/work-k.svg" width="108" height="47" mask="url(#s1orkK)"/></svg><svg
      class="weave" viewBox="0 0 15 31.5" preserveAspectRatio="none" aria-hidden="true"><path d="M0 31.5L3 9L15 0L10.5 29.5L0 31.5Z"/></svg></div>
  </div>
  <!-- SCROLL DOWN — 격자 아래 여백 한가운데. 들어오면 아래에서 올라오고, 스크롤 내릴 때까지 둥둥 떠 있는다 (stage1.js scrollHint).
       무대(#s1stage)는 격자 바깥을 잘라내므로(clip-path) 여기 글자는 무대 밖 형제로 둔다.
       span 은 올라오는 것, i 는 글자(떠다님), b 는 글자가 눌려서 되는 막대(u 가 채워지는 부분) —
       한 요소에 여러 개를 걸면 transform 이 서로 덮어쓴다 -->
  <div id="s1scroll"><span aria-hidden="true"><i>SCROLL DOWN</i><b><u></u></b></span>
    <!-- 섹션 이동 — 막대가 서고 옆으로 넓어진 뒤 위에 뜬다. 누르면 그 섹션까지 휠을 대신 굴림 (stage1.js jumpTo). 자리 = 막대 진행도(0 · 50% · 100%) -->
    <nav id="s1nav" aria-label="섹션 이동"><button type="button" data-step="0">KIM YUJIN</button><button type="button" data-step="2">WORK</button><button type="button" data-step="4">ABOUT ME</button><button type="button" data-step="6">END</button></nav>
  </div>
</section>

<script type="module" src="/src/main.js"></script>
</body>
</html>
