<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>김유진 — UI/UX Designer Portfolio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Gothic+A1:wght@300;400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
</head>
<body>

<!-- 화면 1: Figma #1 프레임. 1920 기준 무대를 화면에 맞춰 scale (src/stages/stage1.js). 본문은 data.js 의 DUMMY -->
<section class="layer" id="s1" aria-label="김유진">
  <div id="s1stage">
    <!-- 격자 — 선마다 따로 움직이도록 inline. 세로 좌표·높이는 box.js 가 무대 높이에 맞춰 다시 씀 (원본: public/s1/grid.svg) -->
    <svg id="s1grid" width="1800" height="960" viewBox="0 0 1800 960" aria-hidden="true">
      <rect class="bd" x=".5" y=".5" width="1799" height="959"/>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>   <!-- 겹선 5개: 284 · 586 · 888 · 1190 · 1492 -->
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <g class="v"><rect width="1" height="960"/><rect x="22" width="1" height="960"/></g>
      <rect class="h" x="1" width="1798" height="1"/>   <!-- 가로선 3개: 237 · 480 · 724 -->
      <rect class="h" x="1" width="1798" height="1"/>
      <rect class="h" x="1" width="1798" height="1"/>
    </svg>
    <div id="s1box" aria-hidden="true"></div>   <!-- 네모박스 — 퇴장 뒤 휠에 나타나고, 드래그로 커졌다 놓으면 돌아감 (box.js). 나중에 사진으로 교체 -->
    <div id="s1bodyclip"><p id="s1body"></p></div>
    <div id="s1yearclip"><img id="s1year" src="/s1/year.svg" alt="2026 PORTFOLIO" width="286" height="25"></div>   <!-- 창 안에서 위로 올라가며 격자 윗선에 잘려 사라짐 -->
    <!-- 노트북 — 클릭하면 work.html. 사진은 Figma 에서 좌우 반전·크롭된 상태 그대로, 화면 안 CLICK 은 글자별 SVG 가 깜빡임 -->
    <a id="s1laptop" href="/work.html" aria-label="작업 보기">
      <span class="shot"><img src="/s1/laptop.png" alt="" width="1374" height="1145"></span>
      <span class="click" aria-hidden="true">
        <img class="c1" src="/s1/click-c1.svg" alt="" width="16" height="19">
        <img class="l"  src="/s1/click-l.svg"  alt="" width="13" height="20">
        <img class="i"  src="/s1/click-i.svg"  alt="" width="5"  height="20">
        <img class="c2" src="/s1/click-c2.svg" alt="" width="19" height="21">
        <img class="k"  src="/s1/click-k.svg"  alt="" width="19" height="24">
      </span>
    </a>
    <div id="s1name">   <!-- KIM YUJIN — 글자 영역 창. 시퀀스에서 이 창 아래로 사라짐 -->
      <img class="s1-k"  src="/s1/k.svg"  alt="K" width="249.138" height="370.86">
      <img class="s1-i"  src="/s1/i.svg"  alt="I" width="56.441"  height="370.817">
      <img class="s1-m"  src="/s1/m.svg"  alt="M" width="482.636" height="378">
      <img class="s1-y"  src="/s1/y.svg"  alt="Y" width="195"     height="234">
      <img class="s1-u"  src="/s1/u.svg"  alt="U" width="187"     height="234">
      <img class="s1-j"  src="/s1/j.svg"  alt="J" width="84.118"  height="233.997">
      <img class="s1-i2" src="/s1/i2.svg" alt="I" width="34"      height="233">
      <img class="s1-n"  src="/s1/n.svg"  alt="N" width="193.889" height="234.404">
    </div>
  </div>
</section>

<script type="module" src="/src/main.js"></script>
</body>
</html>
