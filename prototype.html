<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Gothic+A1:wght@300;400;500;700;900&family=Gowun+Batang:wght@400;700&display=swap">

<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF;
  --ink:#0A0A0A;
  --mut:#6B6B66;
  --hair:#D6D6D0;
  --grot:'Archivo','Gothic A1',sans-serif;
  --serif:'Gowun Batang',serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--grot);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#scroller{height:820vh}

.layer{
  position:fixed;inset:0;overflow:hidden;background:var(--paper);
  will-change:opacity;
}

/* ══════════ STAGE 1 — 꽉 찬 작은 글씨 + 포인터 반응 ══════════ */
#s1{padding:2.2vh 2.4vw}
#flow{
  font-size:clamp(9px,.78vw,12px);
  font-weight:400;line-height:1.34;
  text-align:justify;word-break:break-all;
  color:var(--ink);
  hyphens:none;
}
#flow b.w{
  display:inline;
  font-family:var(--grot);
  font-weight:900;
  font-size:.1px;
  line-height:.78;
  letter-spacing:-.045em;
  word-break:break-all;
  vertical-align:baseline;
}

/* ══════════ STAGE 2 — 신문 조판 + 원형 구멍 ══════════ */
#s2{padding:4vh 4.4vw;opacity:0}
#s2 .masthead{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:16px;
}
#s2 .masthead b{font-family:var(--grot);font-weight:900;font-size:13px;letter-spacing:.24em}
#s2 .masthead span{font-family:var(--grot);font-size:10.5px;color:var(--mut);letter-spacing:.14em}
#s2 h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(26px,3.5vw,54px);line-height:1.14;letter-spacing:-.025em;
  margin:0 0 10px;max-width:92%;
}
#s2 .dek{
  font-family:var(--serif);font-size:clamp(13px,1.15vw,18px);color:var(--ink);
  border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:14px;line-height:1.5;
}
#s2 .byline{font-family:var(--grot);font-size:10px;letter-spacing:.2em;color:var(--mut);margin-bottom:12px}
#s2 .cols{
  column-count:5;column-gap:2.1vw;column-rule:1px solid var(--hair);
  font-size:clamp(8.5px,.72vw,11px);line-height:1.62;text-align:justify;
  word-break:break-all;height:58vh;overflow:hidden;
}
.stagger{opacity:0;transform:translateY(-16px)}

#holes{position:absolute;inset:0;pointer-events:none}
.hole{
  position:absolute;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  transform:scale(.2);opacity:0;pointer-events:auto;
}
.hole .ring{position:absolute;inset:0;border:1px solid var(--ink);border-radius:50%;opacity:.28}
.objbtn{
  background:none;border:0;padding:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  font:inherit;color:var(--ink);border-radius:50%;
}
.objbtn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.objbtn svg{display:block;transition:transform .22s ease}
.objbtn:hover svg{transform:rotate(12deg) scale(1.08)}
.objbtn .nm{
  font-family:var(--grot);font-size:10px;font-weight:700;letter-spacing:.1em;
  white-space:nowrap;
}
.objbtn .go{font-family:var(--grot);font-size:8.5px;letter-spacing:.16em;color:var(--mut)}

/* ══════════ STAGE 3 — 먼지 + 타이핑 ══════════ */
#s3{opacity:0;pointer-events:none}
#dust{position:absolute;inset:0;width:100%;height:100%;display:block}
#type{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  display:flex;justify-content:center;align-items:center;
  font-family:var(--grot);font-weight:500;
  font-size:clamp(26px,5.4vw,76px);letter-spacing:-.035em;
}
#caret{
  display:inline-block;width:.52em;height:1em;background:var(--ink);
  margin-left:.1em;transform:translateY(.12em);animation:bl .9s step-end infinite;
}
@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}

/* ══════════ CHROME ══════════ */
#rail{position:fixed;right:20px;top:50%;transform:translateY(-50%);width:2px;height:22vh;background:rgba(10,10,10,.14)}
#railfill{position:absolute;left:0;top:0;width:100%;height:0;background:var(--ink)}
#stagelabel{
  position:fixed;right:36px;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;white-space:nowrap;
  font-family:var(--grot);font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--mut);
}
#nudge{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;
  background:var(--ink);color:var(--paper);padding:8px 15px;
  font-family:var(--grot);font-size:10.5px;font-weight:500;letter-spacing:.14em;
  transition:opacity .3s;white-space:nowrap;z-index:6;
}
#nudge .cnt{font-weight:900}
@media (max-width:820px){
  #s2 .cols{column-count:2;height:52vh}
  #stagelabel{display:none}
  #nudge{font-size:9.5px;padding:7px 11px;letter-spacing:.1em}
}

/* ══════════ MODAL ══════════ */
#modal{position:fixed;inset:0;background:rgba(10,10,10,.82);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#sheet{background:var(--paper);width:min(520px,100%);max-height:86vh;overflow:auto;padding:28px;position:relative}
#sheet h2{font-family:var(--serif);font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
#sheet .mm{font-family:var(--grot);font-size:10.5px;letter-spacing:.12em;color:var(--mut);margin-bottom:20px}
#sheet .slab{height:132px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
#sheet p{font-family:var(--grot);font-size:12.5px;font-weight:300;line-height:1.75;color:var(--mut);margin:16px 0 0}
#close{position:absolute;right:12px;top:10px;background:none;border:0;cursor:pointer;font-family:var(--grot);font-size:11px;letter-spacing:.12em;padding:8px 10px;color:var(--ink)}
</style>

<div id="scroller"></div>

<section class="layer" id="s1" aria-label="1. 꽉 찬 화면"><div id="flow"></div></section>

<section class="layer" id="s2" aria-label="2. 정렬된 지면">
  <div class="masthead stagger"><b>KIM YUJIN</b><span>UI/UX DESIGNER — PORTFOLIO 2026</span></div>

<div id="rail"><div id="railfill"></div></div>

  <div id="sheet">
    <button id="close" aria-label="닫기">CLOSE ✕</button>
    <h2 id="mt"></h2>
    <div class="mm" id="mm"></div>
    <div class="slab" id="sl1"></div>
    <div class="slab" id="sl2"></div>
    <p>여기가 프로젝트 상세 페이지로 이어지는 자리. 문제 정의 → 리서치 → 와이어프레임 → 최종 화면 순으로 채우면 돼.</p>
  </div>
</div>

<script>
(function(){
'use strict';

/* ─────────── 데이터 ─────────── */
// 큰 글씨 = 김유진에 대한 짧은 문장/단어
var BIGS = ['김유진','UI/UX','디자이너','책임감','노력하는','경력 없는 신입','의미 있는 디자인',
            '솔직함','욕심이 많다','배우고 싶다','다양한 디자인','레퍼런스','브레인스토밍',
            '와이어프레임','설문조사','대화','Figma','React'];

// 작은 글씨 = 전부 더미 (나중에 실제 본문으로 교체)
var DUMMY = '여백은 비어 있는 자리가 아니라 아직 정해지지 않은 자리다. 무엇을 넣을지 고르는 일은 결국 무엇을 덜어낼지 정하는 일과 같다. 화면을 가득 채운 말들 사이에서 정말 남겨야 할 문장은 몇 개 되지 않는다. 처음에는 모든 것을 다 보여주고 싶어진다. 할 수 있는 것과 해본 것과 하고 싶은 것을 빠짐없이 적어두면 어딘가 안심이 된다. 그러나 읽는 사람은 그 전부를 읽지 않는다. 읽히지 않은 문장은 없는 문장과 다르지 않다. 그래서 덜어내는 연습을 한다. 한 줄을 지우면 그 자리에 숨이 생기고, 숨이 생긴 자리에서야 다음 줄이 보인다. 이것은 더미 텍스트입니다. 실제 본문은 아직 정해지지 않았습니다. 지면의 밀도와 회색도를 확인하기 위한 자리 채움입니다. 글자의 크기와 행간과 단의 폭을 여기서 먼저 시험해 본다. 무엇이 남고 무엇이 사라질지는 다음 화면에서 결정된다. ';

var PROJ = [
  {t:'내셔널지오그래픽 리디자인', m:'반응형 웹디자인 · 1인 개인', o:'circle'},
  {t:'국순당 리디자인',           m:'반응형 웹디자인 · 4인 팀',   o:'arch'},
  {t:'차곡',                     m:'친환경 챌린지 재테크 앱 · 1인', o:'square'},
  {t:'알래말래븐',                m:'24시 지식편의점 앱 · 4인 팀', o:'tri'},
  {t:'너다움',                   m:'시니어 스킨케어 브랜딩 · 2인', o:'cross'},
  {t:'일상의 원',                 m:'북 디자인 · 2인 팀',         o:'ring'}
];
// 구멍 위치 (%) — 클릭 순서대로 지면을 파먹어 들어감
var HOLES = [[50,47,17],[25,30,11],[76,62,12.5],[39,76,9.5],[73,24,9],[18,67,10.5]];

var SLOGAN = 'Keeping It Simple';

/* ─────────── 공통 ─────────── */
var $=function(s){return document.querySelector(s)};
function cl(v,a,b){return v<a?a:(v>b?b:v)}
function smooth(t){return t*t*(3-2*t)}
function lerp(a,b,t){return a+(b-a)*t}

var s1=$('#s1'), s2=$('#s2'), s3=$('#s3'), flow=$('#flow'),
    railfill=$('#railfill'), stagelabel=$('#stagelabel'),
    nudge=$('#nudge'), nudgetxt=$('#nudgetxt'),
    holesEl=$('#holes'), modal=$('#modal');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var fine   = window.matchMedia('(pointer: fine)').matches;

/* 구간 */
var T = {s1End:.26, s2In:.38, s2End:.66, dissolve:.70, dissolveEnd:.93};

/* ═══════════ STAGE 1 ═══════════ */
var words=[], anchors=[], curSize=[];
function slice(i){
  var n = DUMMY.length, st=(i*137)%n, len=430;
  var s = DUMMY.slice(st, st+len);
  if(s.length<len) s += DUMMY.slice(0, len-s.length);
  return s;
}
function buildFlow(){
  var h='';
  for(var i=0;i<BIGS.length;i++){
    h += slice(i) + '<b class="w" data-i="'+i+'">'+BIGS[i]+'</b>';
  }
  h += slice(BIGS.length) + slice(BIGS.length+1);
  flow.innerHTML=h;
  words = [].slice.call(flow.querySelectorAll('b.w'));
  curSize = words.map(function(){return 0});
}
function measureAnchors(){
  words.forEach(function(w){ w.style.fontSize='.1px'; });
  anchors = words.map(function(w){
    var r=w.getBoundingClientRect();
    return {x:r.left, y:r.top};
  });
  curSize = words.map(function(){return 0});
}
var MAXS=0, RAD=0;
function sizing(){
  MAXS = cl(window.innerWidth*0.115, 40, 132);
  RAD  = Math.max(window.innerWidth,window.innerHeight)*0.30;
}
var mx=-9999, my=-9999, dirty=false;
function applyPointer(){
  dirty=false;
  for(var i=0;i<words.length;i++){
    var a=anchors[i]; if(!a) continue;
    var dx=mx-a.x, dy=my-a.y;
    var d=Math.sqrt(dx*dx+dy*dy);
    var t=cl(1-d/RAD,0,1);
    var target = t<=0 ? 0 : MAXS*smooth(t);
    if(Math.abs(target-curSize[i])>0.6){
      curSize[i]=target;
      words[i].style.fontSize = (target<0.5?0.1:target)+'px';
    }
  }
}
function onMove(e){
  mx=e.clientX; my=e.clientY;
  if(!dirty){ dirty=true; requestAnimationFrame(applyPointer); }
  if(!nudgeHidden1){ nudgeHidden1=true; }
}
var nudgeHidden1=false;
window.addEventListener('pointermove', onMove, {passive:true});

// 포인터 없는 환경(터치) — 큰 글씨가 스스로 돌아다님
var autoT=0, autoOn=!fine;
function autoTour(ts){
  if(autoOn && stage===1){
    autoT=ts||0;
    var k=autoT/2600;
    mx=(0.5+0.42*Math.cos(k))*window.innerWidth;
    my=(0.5+0.38*Math.sin(k*1.31))*window.innerHeight;
    applyPointer();
  }
  requestAnimationFrame(autoTour);
}
window.addEventListener('touchstart',function(e){
  autoOn=false;
  if(e.touches[0]){ mx=e.touches[0].clientX; my=e.touches[0].clientY; applyPointer(); }
},{passive:true});
window.addEventListener('touchmove',function(e){
  if(e.touches[0]){ mx=e.touches[0].clientX; my=e.touches[0].clientY;
    if(!dirty){dirty=true;requestAnimationFrame(applyPointer);} }
},{passive:true});

/* ═══════════ STAGE 2 ═══════════ */
$('#s2cols').textContent = DUMMY + DUMMY + DUMMY + DUMMY + DUMMY + DUMMY;

var SHAPES={
  circle:'<circle cx="34" cy="34" r="26" fill="none" stroke="currentColor" stroke-width="3"/>',
  arch:'<path d="M10 62 L10 34 A24 24 0 0 1 58 34 L58 62" fill="none" stroke="currentColor" stroke-width="3"/>',
  square:'<rect x="10" y="10" width="48" height="48" fill="currentColor"/>',
  tri:'<path d="M34 8 L60 58 L8 58 Z" fill="none" stroke="currentColor" stroke-width="3"/>',
  cross:'<path d="M34 8 L34 60 M8 34 L60 34" stroke="currentColor" stroke-width="3"/>',
  ring:'<circle cx="34" cy="34" r="25" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="34" cy="34" r="7" fill="currentColor"/>'
};
var holeNodes=[], punched=0;
function buildHoles(){
  holesEl.innerHTML=''; holeNodes=[];
  var unit=Math.min(window.innerWidth, window.innerHeight);
  HOLES.forEach(function(h,i){
    var p=PROJ[i], r=unit*h[2]/100;
    var d=document.createElement('div');
    d.className='hole';
    d.style.width=d.style.height=(r*2)+'px';
    d.style.left='calc('+h[0]+'% - '+r+'px)';
    d.style.top ='calc('+h[1]+'% - '+r+'px)';
    d.innerHTML='<span class="ring"></span>'+
      '<button class="objbtn" aria-label="'+p.t+' 자세히 보기">'+
      '<svg viewBox="0 0 68 68" width="'+Math.round(r*0.55)+'" height="'+Math.round(r*0.55)+'">'+SHAPES[p.o]+'</svg>'+
      '<span class="nm">'+p.t+'</span><span class="go">VIEW PROJECT →</span></button>';
    d.querySelector('button').addEventListener('click',function(ev){ ev.stopPropagation(); openP(p); });
    holesEl.appendChild(d); holeNodes.push(d);
  });
}
function punch(){
  if(stage!==2 || punched>=HOLES.length) return;
  var d=holeNodes[punched];
  d.style.transition='transform .52s cubic-bezier(.16,1.1,.3,1), opacity .3s';
  d.style.transform='scale(1)'; d.style.opacity='1';
  punched++;
  setNudge();
}
window.addEventListener('click', function(e){
  if(stage===2 && !modal.classList.contains('on') && !e.target.closest('.objbtn')) punch();
});

function openP(p){
  $('#mt').textContent=p.t; $('#mm').textContent=p.m;
  var svg='<svg viewBox="0 0 68 68" width="52" height="52">'+SHAPES[p.o]+'</svg>';
  $('#sl1').innerHTML=svg; $('#sl2').innerHTML=svg;
  modal.classList.add('on'); $('#close').focus();
}
function shut(){ modal.classList.remove('on'); }
$('#close').addEventListener('click',shut);
modal.addEventListener('click',function(e){ if(e.target===modal) shut(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') shut(); });

var staggerEls=[].slice.call(document.querySelectorAll('#s2 .stagger'));
var staggered=false;
function runStagger(){
  if(staggered) return; staggered=true;
  staggerEls.forEach(function(el,i){
    el.style.transition='opacity .5s ease '+(i*.085)+'s, transform .62s cubic-bezier(.2,.9,.25,1) '+(i*.085)+'s';
    el.style.opacity='1'; el.style.transform='translateY(0)';
  });
}

/* ═══════════ STAGE 3 — 먼지 ═══════════ */
var cvs=$('#dust'), ctx=cvs.getContext('2d'), parts=null, dpr=1, builtWith=-1;
function drawReplica(w,h){
  var off=document.createElement('canvas'); off.width=w; off.height=h;
  var c=off.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,w,h);
  c.fillStyle='#000';
  var padX=w*0.044, padY=h*0.04;
  var hs=Math.max(22,Math.min(54,w*0.035));
  c.font='700 '+hs+'px "Gowun Batang", serif';
  c.fillText('단순히 예쁜 것보다', padX, padY+hs);
  c.fillText('의미 있는 디자인을 하고 싶습니다', padX, padY+hs*2.16);
  var top=padY+hs*3.2;
  c.fillRect(padX, top, w-padX*2, 1);
  var ncol = w<820?2:5, gap=w*0.021;
  var colw=(w-padX*2-gap*(ncol-1))/ncol;
  var fs=Math.max(8, Math.min(11, w*0.0072)), lh=fs*1.62;
  c.font='400 '+fs+'px "Archivo","Gothic A1",sans-serif';
  var chars=DUMMY.repeat(8), ci=0;
  var cpl=Math.max(6,Math.floor(colw/(fs*0.98)));
  for(var col=0;col<ncol;col++){
    var x=padX+col*(colw+gap), y=top+lh*1.8;
    while(y<h-padY){
      c.fillText(chars.substr(ci%chars.length, cpl), x, y);
      ci+=cpl; y+=lh;
    }
  }
  return off;
}
function buildParts(){
  var w=Math.floor(window.innerWidth), h=Math.floor(window.innerHeight);
  var off=drawReplica(w,h);
  var data=off.getContext('2d').getImageData(0,0,w,h).data;
  var step = w*h>1600000 ? 3 : 2;
  var cx=w/2, cy=h/2, arr=[];
  for(var y=0;y<h;y+=step){
    for(var x=0;x<w;x+=step){
      if(data[(y*w+x)*4]>150) continue;              // 흰 픽셀 skip
      if(insideHole(x,y,w,h)) continue;              // 파낸 구멍은 이미 비었음
      var dx=x-cx, dy=y-cy, L=Math.hypot(dx,dy)||1;
      // 컬 필드: 중심 기준 회전 + 우상단 흐름 → 레퍼런스의 아치형 궤적
      var ux=(-dy/L)*0.85 + 0.55, uy=(dx/L)*0.85 - 0.62;
      var m=Math.hypot(ux,uy)||1;
      arr.push({x:x,y:y,ux:ux/m,uy:uy/m,s:0.35+Math.random()*1.7,d:Math.random(),j:Math.random()*2-1});
      if(arr.length>9000) { y=h; break; }
    }
  }
  parts=arr; builtWith=punched;
}
function insideHole(x,y,w,h){
  var unit=Math.min(w,h);
  for(var i=0;i<punched;i++){
    var hx=w*HOLES[i][0]/100, hy=h*HOLES[i][1]/100, r=unit*HOLES[i][2]/100;
    if((x-hx)*(x-hx)+(y-hy)*(y-hy) < r*r) return true;
  }
  return false;
}
function sizeCanvas(){
  dpr=Math.min(window.devicePixelRatio||1, 1.5);
  cvs.width=Math.floor(window.innerWidth*dpr);
  cvs.height=Math.floor(window.innerHeight*dpr);
}
function drawDust(q){
  if(!parts) return;
  var w=cvs.width, h=cvs.height;
  ctx.clearRect(0,0,w,h);
  var S=Math.max(window.innerWidth,window.innerHeight)*1.15;
  var disp=Math.pow(q,1.7)*S;
  var buckets=[[],[],[],[],[]];
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    var a=1-cl((q-0.10*p.d)/0.62,0,1);
    if(a<=0.02) continue;
    var k=disp*p.s;
    var px=(p.x + p.ux*k + p.j*k*0.18)*dpr;
    var py=(p.y + p.uy*k + p.j*k*0.11 - k*0.10)*dpr;
    if(px<-20||py<-20||px>w+20||py>h+20) continue;
    buckets[Math.min(4,Math.floor(a*5))].push(px,py);
  }
  var sz=Math.max(1, 1.35*dpr);
  for(var b=4;b>=0;b--){
    var arr=buckets[b]; if(!arr.length) continue;
    ctx.fillStyle='rgba(10,10,10,'+((b+1)/5*0.92).toFixed(2)+')';
    for(var j=0;j<arr.length;j+=2) ctx.fillRect(arr[j],arr[j+1],sz,sz);
  }
}

/* 타이핑 */
var typed=$('#typed'), typeStart=null, typeOn=false;
function typing(p){
  var go = p>0.885;
  if(go && !typeOn){ typeOn=true; typeStart=performance.now(); }
  if(!go && typeOn){ typeOn=false; typed.textContent=''; }
  if(typeOn){
    var n=Math.floor((performance.now()-typeStart)/62);
    typed.textContent=SLOGAN.slice(0,Math.min(n,SLOGAN.length));
  }
}

/* ═══════════ 스크롤 오케스트레이션 ═══════════ */
var stage=1;
function setNudge(){
  if(stage===1){ nudgetxt.textContent = fine?'마우스를 움직여 보세요':'화면을 문질러 보세요'; nudge.style.opacity='1'; }
  else if(stage===2){
    nudgetxt.innerHTML = punched>=HOLES.length
      ? '계속 스크롤하세요'
      : '클릭해서 지면을 파내세요 &nbsp;<span class="cnt">'+punched+'/6</span>';
    nudge.style.opacity='1';
  }
  else nudge.style.opacity='0';
}
function frame(){
  var max=document.body.scrollHeight-window.innerHeight;
  var p=max>0?cl(window.scrollY/max,0,1):0;

  var o1=1-cl((p-T.s1End)/(T.s2In-T.s1End),0,1);
  var o2=cl((p-T.s1End-0.02)/(T.s2In-T.s1End),0,1) * (1-cl((p-T.s2End)/(T.dissolve-T.s2End+0.03),0,1));
  var o3=cl((p-T.s2End-0.01)/0.05,0,1);

  s1.style.opacity=o1; s1.style.pointerEvents=o1>0.5?'auto':'none';
  s2.style.opacity=o2; s2.style.pointerEvents=o2>0.5?'auto':'none';
  s3.style.opacity=o3;
  s1.style.filter = o1<1 ? 'blur('+((1-o1)*4).toFixed(1)+'px)' : 'none';

  var ns = p<T.s1End+0.04 ? 1 : (p<T.s2End+0.02 ? 2 : 3);
  if(ns!==stage){ stage=ns; setNudge(); }
  if(stage>=2) runStagger();

  if(p>T.s2End-0.06 && (!parts || builtWith!==punched)) buildParts();
  if(o3>0.01){
    var q=cl((p-T.dissolve)/(T.dissolveEnd-T.dissolve),0,1);
    drawDust(q);
  }
  typing(p);

  railfill.style.height=(p*100)+'%';
  stagelabel.textContent = stage===1?'01 — 꽉 참' : (stage===2?'02 — 정렬 · 파내기':'03 — 한 문장');
}

var tick=false;
function onScroll(){ if(!tick){ tick=true; requestAnimationFrame(function(){ frame(); tick=false; }); } }
window.addEventListener('scroll', onScroll, {passive:true});

var rz;
function onResize(){
  clearTimeout(rz);
  rz=setTimeout(function(){
    sizing(); measureAnchors(); buildHoles();
    for(var i=0;i<punched;i++){ holeNodes[i].style.transition='none'; holeNodes[i].style.transform='scale(1)'; holeNodes[i].style.opacity='1'; }
    sizeCanvas(); parts=null; builtWith=-1; frame();
  },180);
}
window.addEventListener('resize', onResize);

/* init */
buildFlow(); sizing(); buildHoles(); sizeCanvas();
function boot(){ measureAnchors(); setNudge(); frame(); if(!fine) requestAnimationFrame(autoTour); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else setTimeout(boot,400);
})();
</script>
