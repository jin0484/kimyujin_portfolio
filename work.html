<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — 김유진</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Gothic+A1:wght@300;400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- 화면 1 노트북 클릭 → 노트북이 화면 가득 커진 뒤(laptopZoom.js) 이 페이지로 (브라우저 View Transitions — 없는 브라우저는 그냥 넘어감).
       커진 노트북 화면과 이 페이지가 같은 검정이라 연출 없이 바로 바꾼다(노트북 CLICK 은 넘어가기 전에 이미 사라짐).
       head 에 직접 둬야 첫 화면이 그려지기 전에 적용됨 -->
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  </style>
</head>
<body>

<!-- Work 페이지 — #0c0c0c 바닥 (노트북 화면 안). 가운데 초록 CLICK 은 2026-09-24 사용자 요청으로 뺐다 — 내용은 앞으로 채울 자리 -->
<main id="work" aria-label="Work"></main>
<!-- 닫기 — 오른쪽 위, 메인 초록. 노트북을 누르고 들어왔으면 뒤로 가기(원래 있던 화면 그대로), 아니면 첫 화면으로. Esc 로도 (work.js) -->
<button id="workclose" type="button" aria-label="닫기 — 첫 화면으로"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 3L29 29M29 3L3 29"/></svg></button>

<script type="module" src="/src/work.js"></script>
</body>
</html>
