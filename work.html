<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — 김유진</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Gothic+A1:wght@300;400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- 화면 1 노트북 클릭 → 이 페이지가 아래에서 올라오며 기존 화면을 덮음 (브라우저 View Transitions — 없는 브라우저는 그냥 넘어감).
       head 에 직접 둬야 첫 화면이 그려지기 전에 적용됨. 걸리는 시간: animation 의 .7s -->
  <style>
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: none; }
    ::view-transition-new(root) { animation: workUp .7s cubic-bezier(.65, 0, .35, 1) both; }
    @keyframes workUp { from { transform: translateY(100%); } to { transform: none; } }
  </style>
</head>
<body>

<!-- Work 페이지 (임시) — Figma "Work #1"(110:335): 배경 + 격자만. 화면 1 의 노트북을 클릭하면 여기로 -->
<main id="work" aria-label="Work">
  <img id="workgrid" src="/work/grid.svg" alt="" width="1800" height="960">
</main>

<script type="module" src="/src/work.js"></script>
</body>
</html>
